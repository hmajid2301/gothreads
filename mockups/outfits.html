<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Outfits - go-threads</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container header-content">
      <a href="index.html" class="logo">🧵 go-threads</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="wardrobe.html">Wardrobe</a>
        <a href="outfits.html" class="active">Outfits</a>
        <a href="calendar.html">Calendar</a>
        <a href="settings.html">Settings</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="toolbar">
        <h1>My Outfits</h1>
        <div class="toolbar-actions">
          <a href="outfit-builder.html" class="btn btn-primary">+ Create Outfit</a>
        </div>
      </div>

      <!-- Filters -->
      <div class="card" style="margin-bottom: 1.5rem;">
        <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
          <div class="form-group" style="margin: 0; flex: 1; min-width: 200px;">
            <input type="text" id="outfit-search" placeholder="🔍 Search outfits by name or notes...">
          </div>
          <div class="form-group" style="margin: 0;">
            <select id="rating-filter">
              <option value="all">All Ratings</option>
              <option value="5">⭐⭐⭐⭐⭐ (5 stars)</option>
              <option value="4">⭐⭐⭐⭐ (4+ stars)</option>
              <option value="3">⭐⭐⭐ (3+ stars)</option>
            </select>
          </div>
          <div class="form-group" style="margin: 0;">
            <select id="sort-filter">
              <option value="recent">Recently Created</option>
              <option value="name">Name (A-Z)</option>
              <option value="rating">Highest Rated</option>
              <option value="worn">Most Worn</option>
            </select>
          </div>
        </div>
      </div>

      <div class="grid grid-3" id="outfits-grid">
        <!-- Dynamically rendered by JavaScript -->
      </div>

      <!-- AI Suggest Outfit -->
      <div class="card" style="margin-top: 2rem;">
        <h2>🎯 Suggest Outfit</h2>
        <p style="color: var(--text-neutral); margin-bottom: 1.5rem;">
          Tell AI about the occasion and weather, and it will create a complete outfit from your wardrobe.
        </p>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
          <div class="form-group">
            <label>Occasion</label>
            <select id="occasion-select">
              <option value="casual">Casual</option>
              <option value="formal">Formal</option>
              <option value="business">Business/Work</option>
              <option value="sporty">Sporty/Athletic</option>
              <option value="date">Date Night</option>
              <option value="party">Party/Event</option>
            </select>
          </div>
          <div class="form-group">
            <label>Weather</label>
            <select id="weather-select">
              <option value="hot">Hot (25°C+)</option>
              <option value="warm">Warm (20-25°C)</option>
              <option value="mild">Mild (15-20°C)</option>
              <option value="cool">Cool (10-15°C)</option>
              <option value="cold">Cold (&lt;10°C)</option>
              <option value="rainy">Rainy</option>
            </select>
          </div>
        </div>
        <button id="suggest-outfit-btn" class="btn btn-primary" style="width: 100%;">
          ✨ Suggest Outfit
        </button>
        <div id="outfit-suggestion-result" style="display: none; margin-top: 1.5rem; padding: 1.5rem; background: var(--warm-bg); border-radius: 0.5rem;"></div>
      </div>

    </div>
  </main>

  <!-- Floating Voice Button -->
  <button class="voice-input-btn floating-voice-btn" onclick="startVoiceInput()" title="Voice commands">🎤</button>

  <script src="js/app.js"></script>
  <script>
    // Initialize outfits page with filters
    document.addEventListener('DOMContentLoaded', () => {
      checkAIStatus();
      initOutfitsFilters();
      renderOutfits('outfits-grid');
      initAIStylist();

      // Check if we should open a specific outfit from URL parameter
      const urlParams = new URLSearchParams(window.location.search);
      const outfitId = urlParams.get('outfit');
      if (outfitId) {
        // Small delay to ensure outfits are rendered
        setTimeout(() => {
          const outfit = appData.outfits.find(o => o.id == outfitId);
          if (outfit) {
            viewOutfit(outfit.id);
          }
        }, 100);
      }
    });
  </script>
</body>
</html>
