<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Details - go-threads</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container header-content">
      <a href="index.html" class="logo">🧵 go-threads</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="wardrobe.html">Wardrobe</a>
        <a href="upload.html">Upload</a>
        <a href="outfits.html">Outfits</a>
        <a href="analytics.html">Analytics</a>
        <a href="settings.html">Settings</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="card">
        <h1>Edit Item Details</h1>

        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; margin-top: 2rem;">
          <div>
            <img id="item-image-preview" src="https://via.placeholder.com/400" alt="Item" style="width: 100%; border-radius: 0.75rem;">
            <div style="margin-top: 1rem; padding: 1rem; background: var(--warm-bg); border-radius: 0.5rem; text-align: center;">
              <p style="color: var(--text-neutral); font-size: 0.875rem;">
                ✨ Background removed by AI
              </p>
            </div>
          </div>

          <div id="item-detail">
            <div class="form-group">
              <label>Item Name</label>
              <input type="text" id="item-name" placeholder="e.g., Blue Denim Jeans">
            </div>

            <div class="form-group">
              <label>Category</label>
              <select id="item-category">
                <option>Tops</option>
                <option>Bottoms</option>
                <option>Shoes</option>
                <option>Outerwear</option>
                <option>Accessories</option>
              </select>
            </div>

            <div class="form-group">
              <label>Price (USD)</label>
              <input type="number" id="item-price" placeholder="79.99" step="0.01">
            </div>

            <div class="form-group">
              <label>Brand</label>
              <input type="text" id="item-brand" placeholder="e.g., Levi's">
            </div>

            <div class="form-group">
              <label>Color</label>
              <input type="text" id="item-color" placeholder="Auto-detected: Blue">
            </div>

            <div class="form-group">
              <label>Season</label>
              <select id="item-season">
                <option>All Season</option>
                <option>Spring</option>
                <option>Summer</option>
                <option>Fall</option>
                <option>Winter</option>
              </select>
            </div>

            <div class="form-group">
              <label>Notes</label>
              <textarea id="item-notes" rows="3" placeholder="Any additional details..."></textarea>
            </div>

            <div class="form-group">
              <label>Brand</label>
              <div style="display: flex; gap: 0.5rem; align-items: center;">
                <input type="text" id="item-brand" placeholder="e.g., MR MARVIS" style="flex: 1;">
                <button id="enhance-brand-btn" class="btn btn-secondary" style="padding: 0.5rem 0.75rem; font-size: 0.875rem; white-space: nowrap;">
                  ✨ Detect with AI (13b)
                </button>
              </div>
              <p style="font-size: 0.75rem; color: var(--text-neutral); margin-top: 0.25rem;">
                Use enhanced AI model for better brand label detection (slower)
              </p>
            </div>

            <div class="form-group" id="tags-section" style="display: none;">
              <label>
                Tags
                <button id="regenerate-tags-btn" class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; margin-left: 0.5rem;">
                  🔄 Regenerate with AI
                </button>
              </label>
              <div id="item-tags" style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem;"></div>
            </div>

            <div id="ai-analysis-section" style="display: none; margin-bottom: 1.5rem; padding: 1rem; background: var(--warm-bg); border-radius: 0.5rem;">
              <label style="font-size: 0.875rem; color: var(--text-neutral);">AI Analysis</label>
              <p id="ai-analysis-text" style="font-size: 0.875rem; margin-top: 0.5rem;"></p>
            </div>

            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
              <button id="save-item-btn" class="btn btn-primary">Save Item</button>
              <button id="wear-item-btn" class="btn btn-secondary">👔 Log Wear</button>
              <button id="find-matches-btn" class="btn btn-secondary">✨ Find Matching Items</button>
              <button class="btn btn-secondary" onclick="window.location.href='wardrobe.html'">Cancel</button>
              <button id="delete-item-btn" class="btn" style="background: #E74C3C; color: white;">Delete</button>
            </div>
          </div>
        </div>
      </div>

      <div id="style-matches-section" style="display: none;" class="card" style="margin-top: 1.5rem;">
        <h2>✨ Items That Match Well</h2>
        <div id="style-matches-grid" class="wardrobe-grid"></div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
