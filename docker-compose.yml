services:
  gothreads:
    image: gothreads/gothreads:latest
    build: ./mockups/api
    ports:
      - "8556:8556"
    environment:
      PORT: 8556
      DATABASE_URL: postgres://gothreads:gothreads@postgres:5432/gothreads?sslmode=disable
      GOTHREADS_CONFIG: /config/config.yaml
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SKIP_AUTH: ${SKIP_AUTH:-false}
    volumes:
      - gothreads_data:/var/lib/gothreads
      - ./config.yaml:/config/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8556/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gothreads
      POSTGRES_PASSWORD: gothreads
      POSTGRES_DB: gothreads
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gothreads"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/gothreads --ignore-existing;
      mc anonymous set download myminio/gothreads;
      exit 0;
      "

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    profiles:
      - ai

  rembg:
    image: danielgatis/rembg:latest
    ports:
      - "5000:5000"
    command: ["p", "--host", "0.0.0.0", "--port", "5000"]
    restart: unless-stopped
    profiles:
      - ai

volumes:
  postgres_data:
  minio_data:
  gothreads_data:
  ollama_data:
