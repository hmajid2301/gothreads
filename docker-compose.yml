services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gothreads
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  migrate:
    image: gomicro/goose:3.25.0
    depends_on:
      postgres:
        condition: service_healthy
    command: [
      "goose", "-dir", "/migrations", "postgres",
      "host=postgres port=5432 user=postgres password=postgres dbname=gothreads sslmode=disable",
      "up"
    ]
    volumes:
      - ./backend/store/db/migrations:/migrations:ro
    restart: "no"

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data
    ports:
      - "8333:8333"
      - "9333:9333"
      - "19333:19333"
    volumes:
      - seaweedfs-data:/data
    environment:
      WEED_S3_ACCESS_KEY: admin
      WEED_S3_SECRET_KEY: admin123

  mock-oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      JSON_CONFIG: |
        {
          "interactiveLogin": true,
          "httpServer": "NettyWrapper",
          "tokenCallbacks": []
        }

  rembg:
    image: danielgatis/rembg:latest
    command: s -p 5000
    ports:
      - "5000:5000"
    environment:
      MODEL: u2net

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # For CPU-only, comment out the deploy section above

  # Pull vision model on startup (llava for image understanding)
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 5
        ollama pull llava:7b
        ollama pull llama3.2:3b
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: ollama:11434
    restart: "no"

volumes:
  postgres-data:
  seaweedfs-data:
  ollama-data:
