services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gothreads
    ports:
      - "15433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  migrate:
    image: gomicro/goose:3.25.0
    depends_on:
      postgres:
        condition: service_healthy
    command: [
      "goose", "-dir", "/migrations", "postgres",
      "host=postgres port=5432 user=postgres password=postgres dbname=gothreads sslmode=disable",
      "up"
    ]
    volumes:
      - ./backend/store/db/migrations:/migrations:ro
    restart: "no"

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data
    ports:
      - "8333:8333"
      - "9333:9333"
      - "19333:19333"
    volumes:
      - seaweedfs-data:/data
    environment:
      WEED_S3_ACCESS_KEY: admin
      WEED_S3_SECRET_KEY: admin123

  # mock-oauth2:
  #   image: ghcr.io/navikt/mock-oauth2-server:2.1.10
  #   ports:
  #     - "8090:8090"
  #   environment:
  #     SERVER_PORT: 8090
  #     JSON_CONFIG: |
  #       {
  #         "interactiveLogin": true,
  #         "httpServer": "NettyWrapper",
  #         "tokenCallbacks": []
  #       }
  #
  rembg:
    image: danielgatis/rembg:latest
    command: s -p 5000
    ports:
      - "5000:5000"
    environment:
      MODEL: u2net

  catvton:
    build:
      context: ./mockups/catvton
    ports:
      - "7860:7860"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    security_opt:
      - seccomp:unconfined
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
      - PYTORCH_HIP_ALLOC_CONF=expandable_segments:True
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860

  # ladivton-shoes:
  #   build:
  #     context: ./mockups/ladivton-shoes
  #   dns:
  #     - 1.1.1.1
  #   ports:
  #     - "8558:8558"
  #   volumes:
  #     - huggingface-cache:/root/.cache/huggingface
  #   devices:
  #     - /dev/kfd:/dev/kfd
  #     - /dev/dri:/dev/dri
  #   group_add:
  #     - video
  #     - render
  #   security_opt:
  #     - seccomp:unconfined
  #   environment:
  #     - HSA_OVERRIDE_GFX_VERSION=11.5.1
  #     - PYTORCH_HIP_ALLOC_CONF=expandable_segments:True

volumes:
  postgres-data:
  seaweedfs-data:
  huggingface-cache:
