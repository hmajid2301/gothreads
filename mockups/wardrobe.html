<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wardrobe - go-threads</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container header-content">
      <a href="index.html" class="logo">🧵 go-threads</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="wardrobe.html" class="active">Wardrobe</a>
        <a href="upload.html">Upload</a>
        <a href="outfits.html">Outfits</a>
        <a href="analytics.html">Analytics</a>
        <a href="settings.html">Settings</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="toolbar">
        <h1>My Wardrobe</h1>
        <div class="toolbar-actions">
          <select id="category-filter" style="padding: 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border);">
            <option value="all">All Categories</option>
            <option value="Tops">Tops</option>
            <option value="Bottoms">Bottoms</option>
            <option value="Shoes">Shoes</option>
            <option value="Outerwear">Outerwear</option>
            <option value="Accessories">Accessories</option>
          </select>
          <a href="upload.html" class="btn btn-primary">+ Add Item</a>
        </div>
      </div>

      <div class="card" style="margin-bottom: 1.5rem;">
        <h2>👗 Wardrobe Analysis</h2>
        <p style="color: var(--text-neutral); margin-bottom: 1rem;">
          Get a complete analysis of your wardrobe: what you have, what's missing, and personalized recommendations.
        </p>
        <button id="analyze-wardrobe-btn" class="btn btn-primary" style="width: 100%;">
          🔍 Analyze My Wardrobe
        </button>
        <div id="wardrobe-analysis-result" style="display: none; margin-top: 1.5rem;"></div>
      </div>

      <div class="grid grid-4" id="wardrobe-grid">
        <!-- Populated by JavaScript -->
      </div>
    </div>
  </main>

  <!-- Floating Voice Button -->
  <button class="voice-input-btn floating-voice-btn" onclick="startVoiceInput()" title="Voice commands: 'Show my tops', 'Create outfit', etc.">🎤</button>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initAIStylist();
    });
  </script>
</body>
</html>
