<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outfit Calendar - go-threads</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .month-nav h2 {
      margin: 0;
    }
    .month-nav button {
      background: var(--warm-bg);
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1.25rem;
    }
    .month-nav button:hover {
      background: var(--primary);
      color: white;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
    }
    .calendar-header {
      text-align: center;
      font-weight: 600;
      padding: 0.75rem;
      color: var(--text-neutral);
      font-size: 0.875rem;
    }
    .calendar-day {
      aspect-ratio: 1;
      background: white;
      border-radius: 0.5rem;
      padding: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      min-height: 100px;
      display: flex;
      flex-direction: column;
    }
    .calendar-day:hover {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }
    .calendar-day.today {
      border: 2px solid var(--primary);
      background: var(--warm-bg);
    }
    .calendar-day.has-outfit {
      background: var(--warm-bg);
    }
    .calendar-day.other-month {
      opacity: 0.3;
    }
    .day-number {
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--text-primary);
    }
    .day-outfit {
      margin-top: 0.5rem;
      display: flex;
      gap: 0.25rem;
      flex-wrap: wrap;
      flex: 1;
      align-items: flex-start;
    }
    .day-outfit-thumb {
      width: 32px;
      height: 32px;
      border-radius: 0.25rem;
      object-fit: cover;
      border: 1px solid #eee;
    }
    .day-event {
      font-size: 0.7rem;
      color: var(--text-neutral);
      margin-top: 0.25rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .weather-badge {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-content">
      <a href="index.html" class="logo">🧵 go-threads</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="wardrobe.html">Wardrobe</a>
        <a href="outfits.html">Outfits</a>
        <a href="calendar.html" class="active">Calendar</a>
        <a href="analytics.html">Analytics</a>
        <a href="settings.html">Settings</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="toolbar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h1>Outfit Calendar</h1>
        <div class="toolbar-actions" style="display: flex; gap: 1rem; align-items: center;">
           <div id="weather-widget" style="display: flex; align-items: center; gap: 0.5rem; background: var(--bg-card); padding: 0.5rem 1rem; border-radius: 2rem; border: 1px solid var(--border);">
              <span style="font-size: 1.5rem;">🌤️</span>
              <div>
                <div style="font-weight: 600; font-size: 0.9rem;" data-weather-location>London</div>
                <div style="font-size: 0.8rem; color: var(--text-neutral);" data-weather-temp>18°C • Partly Cloudy</div>
              </div>
           </div>
          <button id="ai-calendar-suggest-btn" class="btn btn-primary">✨ AI Suggestions</button>
        </div>
      </div>

      <div class="card">
        <div class="month-nav">
          <button onclick="changeMonth(-1)">←</button>
          <h2 id="current-month">February 2026</h2>
          <button onclick="changeMonth(1)">→</button>
        </div>

        <div class="calendar-grid" id="calendar-grid">
          <div class="calendar-header">Sun</div>
          <div class="calendar-header">Mon</div>
          <div class="calendar-header">Tue</div>
          <div class="calendar-header">Wed</div>
          <div class="calendar-header">Thu</div>
          <div class="calendar-header">Fri</div>
          <div class="calendar-header">Sat</div>
          <!-- Day cells will be added here by JavaScript -->
        </div>
      </div>

      <!-- Legend -->
      <div class="card">
        <h3>Legend</h3>
        <div style="display: flex; gap: 2rem; flex-wrap: wrap;">
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <div style="width: 20px; height: 20px; background: var(--warm-bg); border-radius: 0.25rem;"></div>
            <span>Outfit logged</span>
          </div>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <div style="width: 20px; height: 20px; border: 2px solid var(--primary); border-radius: 0.25rem;"></div>
            <span>Today</span>
          </div>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span>☀️🌤️⛅🌧️❄️</span>
            <span>Weather forecast</span>
          </div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="card">
        <h3>Quick Actions</h3>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
          <a href="outfit-builder.html" class="btn btn-primary">+ Plan Tomorrow's Outfit</a>
          <button class="btn btn-secondary" onclick="updateWeatherWidget('weather-widget'); showToast('Weather refreshed!')">🌤️ Refresh Weather</button>
          <button class="btn btn-secondary" onclick="showToast('Calendar exported!')">📅 Export to Calendar</button>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <!-- Floating Voice Button -->
  <button class="voice-input-btn floating-voice-btn" onclick="startVoiceInput()" title="Voice commands">🎤</button>

  <script src="js/app.js"></script>
  <script>
    // Initialize calendar when page loads
    document.addEventListener('DOMContentLoaded', () => {
      checkAIStatus();
      updateWeatherWidget('weather-widget');
      initCalendar();
    });
  </script>
</body>
</html>
